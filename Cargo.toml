[package]
name = "ai-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"] }
thiserror = "2"
tower-http = { version = "0.6", features = ["cors", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
bytes = "1"
http = "1"
async-stream = "0.3"
pin-project = "1"
base64 = "0.22"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
